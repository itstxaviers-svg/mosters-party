<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monsters' Party — Original / Corrected</title>
  <style>
    body { margin: 0; padding: 32px; color: #f7f1dc; background: #071514; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: clamp(28px, 5vw, 56px); margin: 0; } p { color: #aac0b8; }
    main { display: grid; gap: 24px; }
    article { border: 1px solid #ffffff22; border-radius: 16px; overflow: hidden; background: #0c211f; }
    h2 { margin: 0; padding: 12px 16px; font-size: 16px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #ffffff22; }
    figure { margin: 0; padding: 12px; background: #071514; } figcaption { margin-bottom: 8px; color: #b8e34a; font-weight: 800; letter-spacing: .08em; }
    img { display: block; width: 100%; height: 320px; object-fit: contain; background: #020706; }
    @media (max-width: 700px) { .pair { grid-template-columns: 1fr; } img { height: 240px; } }
  </style>
</head>
<body>
  <h1>Original / corrected assets</h1>
  <p>Development-only visual QA. Shape, faces, composition, animation and alpha remain unchanged; only the per-image yellow cast is reduced.</p>
  <main id="assets"></main>
  <script>
    const assets = [
      'house.png', 'hub.png', 'party.png',
      'rooms/skeleton.png', 'rooms/troll.png', 'rooms/witch.png', 'rooms/vampire.png', 'rooms/ghost.png', 'rooms/raven.png',
      'portraits/skeleton.png', 'portraits/troll.png', 'portraits/witch.png', 'portraits/vampire.png', 'portraits/ghost.png', 'portraits/raven.png',
      'characters/skeleton.gif', 'characters/troll.gif', 'characters/witch.gif', 'characters/vampire.gif', 'characters/ghost.gif', 'characters/raven.gif',
      'food/melon.png', 'food/toast.png', 'food/bacon.png', 'food/juice.png', 'food/peach.png', 'food/roll.png'
    ]
    const main = document.querySelector('#assets')
    for (const asset of assets) {
      const article = document.createElement('article')
      article.innerHTML = `<h2>${asset}</h2><div class="pair"><figure><figcaption>ORIGINAL</figcaption><img src="../src/assets/original/${asset}" alt="Original ${asset}"></figure><figure><figcaption>CORRECTED</figcaption><img src="../public/assets/images/${asset}" alt="Corrected ${asset}"></figure></div>`
      main.append(article)
    }
  </script>
</body>
</html>
